<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exploring Bali</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Checkpoint 1: header gets a background photo in styles.css -->
  <header>
    <h1>Exploring Bali</h1>
  </header>

  <!-- Checkpoint 2: caption on a semi-transparent overlay -->
  <div class="caption-overlay">
    <p>Bali greets you with warm sea air and the sound of temple bells in the distance.</p>
  </div>

  <main>
    <article>
      <!-- Checkpoint 1: two local images, one is a link -->
      <a href="gallery.html">
        <img src="images/bali-1.jpg" alt="Sunset over a Bali resort pool lined with palm trees" width="220">
      </a>
      <img src="images/bali-2.jpg" alt="Hot air balloon drifting over misty temple silhouettes" width="220">

      <!-- Checkpoint 2: shadowed card with a hover button -->
      <div class="cta-card">
        <button>Plan This Trip</button>
      </div>

      <!-- Checkpoint 3: semantic figure, meter, and progress -->
      <figure>
        <img src="images/machu-picchu.jpg" alt="View of Machu Picchu at sunrise" width="360">
        <figcaption>Sunrise over Machu Picchu &ndash; a must-see for adventurers.</figcaption>
      </figure>
      <p>Local popularity rating:</p>
      <meter value="0.7" min="0" max="1">70%</meter>
      <p>Trip Planning Progress:</p>
      <progress value="3" max="5">60%</progress>
    </article>
  </main>

  <footer>
    <p>&copy; 2026 My Travel Blog</p>
  </footer>
</body>
</html>
