<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Snapshot</title>
  <link rel="stylesheet" href="ch5.css">
</head>
<body>
  <header>
    <h1>My Travel Blog</h1>
  </header>
  <main>
    <!-- Checkpoint 3: flexbox row of cards -->
    <h2>Trip Snapshot</h2>
    <div class="stats-row">
      <div class="stat-card">
        <img src="images/icon-calendar.jpg" alt="Calendar icon" width="48">
        <h4>5 Days</h4>
        <p>Total trip length</p>
      </div>
      <div class="stat-card">
        <img src="images/icon-plane.jpg" alt="Airplane icon" width="48">
        <h4>3 Cities</h4>
        <p>Kyoto, Osaka, Nara</p>
      </div>
      <div class="stat-card">
        <img src="images/icon-budget.jpg" alt="Wallet icon" width="48">
        <h4>$1,200</h4>
        <p>Estimated budget</p>
      </div>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 My Travel Blog</p>
  </footer>
</body>
</html>
